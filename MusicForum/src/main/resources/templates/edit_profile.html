{{>header}}


<!-- edit profile -->
<div class="container d-flex justify-content-center align-items-center" style="min-height: 85vh;">

    <div class="card shadow p-4" style="max-width: 480px; width: 100%;">
        <h2 class="text-center mb-4 fw-bold">Editar perfil</h2>

        <form action="/edit_profile" method="POST" enctype="multipart/form-data">

            {{#error}}
            <div class="alert alert-danger" role="alert">
                {{error}}
            </div>
            {{/error}}

            <!-- name -->
            <div class="mb-3">
                <label for="nombre" class="form-label">Cambiar nombre de usuario</label>
                <input type="text" class="form-control" id="nombre" name="username" value="{{user.username}}"
                    placeholder="Nuevo nombre" required>
            </div>

            <!-- Email -->
            <div class="mb-3">
                <label for="email" class="form-label">Actualizar correo electrónico</label>
                <input type="email" class="form-control" id="email" name="email" value="{{user.email}}"
                    placeholder="usuario@correo.com" required>
            </div>

            <!-- Password -->
            <div class="mb-3">
                <label for="newPassword" class="form-label">Nueva contraseña (opcional)</label>
                <input type="password" class="form-control" id="newPassword" name="newPassword" 
                    placeholder="********">
            </div>

            <!-- Avatar -->
            <div class="mb-3">
                <label for="avatar" class="form-label">Avatar</label>
                <input type="file" class="form-control" id="avatar" name="avatarFile" accept="image/*">
            </div>

             <!-- Token CSRF-->
            <input type="hidden" name="_csrf" value="{{token}}">

            <!-- Submit -->
            <div class="card-footer bg-white d-flex justify-content-center gap-2">
                <button type="submit" class="btn btn-dark">Guardar cambios</button>
                <a href="/user_profile/{{user.id}}" class="btn btn-outline-secondary">Descartar cambios</a>
            </div>

        </form>

    </div>

</div>

{{>footer}}
