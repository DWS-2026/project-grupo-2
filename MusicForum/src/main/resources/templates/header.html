<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MusicForum - Inicio</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">


    <!-- Quill -->
    <link href="https://cdn.jsdelivr.net/npm/quill@2.0.0-rc.2/dist/quill.snow.css" rel="stylesheet" />

    

    <!-- Custom CSS -->
    <link href="/css/styles.css" rel="stylesheet">
</head>

<body class="d-flex flex-column min-vh-100 bg-light">

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">MusicForum</a>


            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link active" href="/">Inicio</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/post_listing">Posts</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/album_listing">Álbumes</a>
                    </li>

                    {{^loggedUser}}
                    <li class="nav-item">
                        <a class="nav-link" href="/login">Login</a>
                    </li>

                    <li class="nav-item">
                        <a class="btn btn-primary ms-2" href="/register">Registrarse</a>
                    </li>
                    {{/loggedUser}}

                    {{#loggedUser}}

                    <!-- If exists and it´s true -->
                    {{#admin}}
                    <li class="nav-item">
                        <a class="nav-link text-warning fw-bold" href="/admin_panel">Panel de Admin</a>
                    </li>
                    {{/admin}}

                    <!-- If not exists or it´s false -->
                    {{^admin}}
                    <li class="nav-item">
                        <a class="nav-link" href="/user_profile">Mi Perfil</a>
                    </li>
                    {{/admin}}
                    <li class="nav-item">
                        <form action="/logout" method="post" class="d-inline">
                            {{#_csrf}}
                                <input type="hidden" name="_csrf" value="{{token}}">
                            {{/_csrf}}
                            <button type="submit" class="btn btn-danger ms-2">Cerrar Sesión</button>
                        </form>
                    </li>
                    {{/loggedUser}}

                </ul>
            </div>
        </div>
    </nav>
