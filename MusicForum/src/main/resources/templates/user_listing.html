{{>header}}


    <div class="container py-5" style="min-height: 85vh;">
        <h2 class="text-center mb-5 fw-bold">Comunidad MusicForum</h2>

        <div class="row g-4">
            {{#users}}
            <div class="col-md-4 col-sm-6">
                <div class="card shadow-sm border-0 text-center p-4">
                    <div class="mb-3">
                        <img src="{{#avatar}}data:image/jpeg;base64,{{avatar}}{{/avatar}}{{^avatar}}/images/avatar_image.jpg{{/avatar}}" 
                             class="rounded-circle img-thumbnail" 
                             alt="Avatar" style="width: 100px; height: 100px; object-fit: cover;">
                    </div>
                    <h5 class="fw-bold">{{username}}</h5>
                    <p class="text-muted small">{{email}}</p>
                    <a href="/user_profile/{{id}}" class="btn btn-dark btn-sm w-100">Ver Perfil</a>
                </div>
            </div>
            {{/users}}
            {{^users}}
            <div class="col-12 text-center">
                <p class="text-muted">No hay usuarios registrados.</p>
            </div>
            {{/users}}
        </div>
    </div>

    {{>footer}}
