<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>{{title}} - {{artist}}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .rym-art-img { width: 300px; border-radius: 4px; }
        .rym-link { text-decoration: none; color: inherit; }
        .rym-link:hover { text-decoration: underline; }
        header, footer { background-color: #f8f9fa; padding: 15px 0; }
        footer { margin-top: 50px; text-align: center; font-size: 0.9rem; color: #6c757d; }
    </style>
</head>
<body>

<!-- Header -->
<header class="mb-4">
    <div class="container d-flex justify-content-between align-items-center">
        <a href="/" class="h4 text-dark">MusicForum</a>
        <nav>
            <a href="/album_listing" class="me-3 rym-link">Álbumes</a>
            <a href="/posts" class="rym-link">Posts</a>
        </nav>
    </div>
</header>

<!-- Main content -->
<div class="container my-5">
    <div class="card shadow-sm p-4">
        <div class="d-flex flex-column align-items-center gap-4">
            <img src="{{image}}" alt="Portada" class="rym-art-img">
            <h2>{{title}}</h2>
            <h4 class="text-muted">{{artist}}</h4>
            <p class="text-muted">Lanzado en {{date}}</p>

            <h5>Canciones:</h5>
            <ul class="list-group w-50">
                {{#songs}}
                <li class="list-group-item">{{.}}</li>
                {{/songs}}
            </ul>

            <div class="d-flex gap-3 mt-4">
                <a href="/album_listing" class="btn btn-dark">Volver a la lista de álbumes</a>
                <button class="btn btn-danger admin-only" data-bs-toggle="modal" data-bs-target="#deleteModal">Eliminar álbum</button>
            </div>
        </div>
    </div>
</div>

<!-- Footer -->
<footer>
    <div class="container">
        &copy; 2026 MusicForum. Todos los derechos reservados.
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- Modal eliminar álbum -->
<div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Eliminar álbum</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body">
                ¿Estás seguro de que quieres eliminar este álbum?
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <form action="/albumDelete/{{id}}" method="post">
                    <button type="submit" class="btn btn-danger">Eliminar</button>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
