{{>header}}

<div class="container my-5">

    <div class="card shadow-sm">
        <div class="card-body p-4">

            <div class="d-flex gap-4">

                <div class="rym-art-col">
                    <img src="{{album.image}}" alt="Portada" class="rym-art-img">
                </div>

                <div>

                    <h2 class="fw-bold mb-2">
                        {{album.artist}} - {{album.title}}
                    </h2>

                    <p class="text-muted mb-4">
                        Lanzado en {{album.date}}
                    </p>

                    <h5 class="fw-bold mb-3">Canciones</h5>

                    <ul class="list-group">

                        {{#album.songs}}
                        <li class="list-group-item">
                            {{.}}
                        </li>
                        {{/album.songs}}

                    </ul>

                    <div class="mt-4 d-flex gap-2">

                        <a href="/album_listing" class="btn btn-dark">
                            Volver a álbumes
                        </a>

                        <button class="btn btn-danger admin-only"
                                data-bs-toggle="modal"
                                data-bs-target="#deleteModal">
                            Eliminar álbum
                        </button>

                    </div>

                </div>

            </div>

        </div>
    </div>

</div>


<!-- Delete confirmation modal -->

<div class="modal fade" id="deleteModal" tabindex="-1">

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content text-center">

            <div class="modal-body p-5">

                <div class="mb-3">
                    <i class="bi bi-trash-fill text-danger" style="font-size: 3rem;"></i>
                </div>

                <h4 class="mb-3">¿Eliminar álbum?</h4>

                <p class="text-muted">
                    Esta acción no se puede deshacer.
                </p>

                <form action="/albumDelete/{{album.id}}" method="post">

                    <button class="btn btn-danger px-4">
                        Eliminar
                    </button>

                    <button type="button"
                            class="btn btn-secondary"
                            data-bs-dismiss="modal">
                        Cancelar
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{{>footer}}
