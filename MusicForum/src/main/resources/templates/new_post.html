{{>header}}


<div class="container my-5" style="min-height: 75vh;">

    <h2 class="fw-bold mb-4">Crear nuevo post</h2>

    <div class="card shadow-sm border-0">
        <div class="row g-0">

            <!-- IMAGE (Optional) -->
            <div class="col-md-4 d-flex justify-content-center align-items-center p-4 bg-light rounded-start">
                <div class="text-center">
                    <i class="bi bi-image text-muted" style="font-size: 4rem;"></i>
                    <p class="text-muted small">La imagen se cargará mediante URL</p>
                </div>
            </div>

            <!-- CREATE POST -->
            <div class="col-md-8">
                <div class="card-body p-4">

                    <!-- El action must coincide with the @PostMapping of the controller -->
                    <form action="/post/new_post" method="post" enctype="multipart/form-data">

                        <!-- Title -->
                        <div class="mb-3">
                            <label for="title" class="form-label fw-bold">Título del post</label>
                            <input type="text" id="title" name="title" class="form-control"
                                placeholder="Ej: Mi álbum favorito de 2024" required>
                        </div>

                        <div class="mb-3">
                            <label for="imageFile" class="form-label fw-bold">Imagen del post</label>
                            <input type="file" id="imageFile" name="imageFile" class="form-control" accept="image/*"
                                required>
                            <div class="form-text">Formatos permitidos: JPG, PNG.</div>
                        </div>


                        <div class="mb-3">
                            <label class="form-label fw-bold">Álbumes relacionados</label>
                            <div class="d-flex flex-column gap-2">
                                {{#albums}}
                                <div class="form-check">
                                    <input type="checkbox" class="form-check-input" name="albumIds" value="{{id}}"
                                        id="album-{{id}}">
                                    <label class="form-check-label" for="album-{{id}}">{{title}}</label>
                                </div>
                                {{/albums}}
                            </div>
                        </div>

                        <!-- Content -->
                        <div class="mb-3">
                            <label for="description" class="form-label fw-bold">Descripción / Contenido</label>
                            <textarea id="description" name="description" class="form-control" rows="6"
                                placeholder="¿Qué quieres compartir con la comunidad?" required></textarea>
                        </div>

                        <!-- Button -->
                        <div class="d-flex gap-2 mt-4">
                            <button type="submit" class="btn btn-outline-light btn-lg mt-3">Publicar post</button>
                            <a href="/post_listing" class="btn btn-outline-light btn-lg mt-3">Cancelar</a>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>

</div>

{{>footer}}
