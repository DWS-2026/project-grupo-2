{{>header}}

<main class="flex-grow-1">
    {{#user}}
    <div class="card shadow p-4 mx-auto" style="max-width: 500px;">
        <div class="text-center">
            <h2 class="text-center mb-4 fw-bold">Mi perfil</h2>
            <img src="{{#avatar}}/downloads/{{avatar}}{{/avatar}}{{^avatar}}/images/avatar_image.jpg{{/avatar}}"
                class="rounded-circle mb-3" 
                alt="Avatar" 
                style="width: 150px; height: 150px; object-fit: cover;">
            <h3 class="fw-bold">{{{username}}}</h3>
            <p class="text-muted">{{email}}</p>
        </div>

        <hr>

        <h5 class="fw-bold">Mis datos</h5>
        <p><strong>Usuario:</strong> {{{username}}}</p>
        <p><strong>Email:</strong> {{{email}}}</p>
        <p><strong>Rol:</strong> {{{userRole}}}</p>
        <p><strong>Miembro desde:</strong> {{{formattedCreatedAt}}}</p>

        <div class="d-flex gap-2 mt-3">
            <a href="/user_posts/{{id}}" class="btn btn-dark w-50">Ver Posts</a>
            {{^admin}}
            <a href="/edit_profile" class="btn btn-outline-secondary w-50">
                <i class="bi bi-pencil"></i> Editar perfil
            </a>
            {{/admin}}
        </div>

    </div>
    {{/user}}

</main>
{{>footer}}
